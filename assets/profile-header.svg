<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Jorge Antonio — Full-Stack Developer</title>
  <desc id="desc">Minimal dark profile banner with Jorge Antonio's name and focus on product engineering, full-stack development, and applied AI.</desc>
  <defs>
    <linearGradient id="bg" x1="80" y1="30" x2="1120" y2="330" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0D1117"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#7DD3FC"/>
      <stop offset="1" stop-color="#A7F3D0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <circle cx="1040" cy="65" r="130" fill="#38BDF8" fill-opacity="0.08" filter="url(#glow)"/>
  <circle cx="1110" cy="300" r="150" fill="#34D399" fill-opacity="0.06" filter="url(#glow)"/>

  <g opacity="0.35" stroke="#334155">
    <path d="M900 40H1160"/>
    <path d="M900 90H1160"/>
    <path d="M900 140H1160"/>
    <path d="M900 190H1160"/>
    <path d="M900 240H1160"/>
    <path d="M900 290H1160"/>
    <path d="M940 20V330"/>
    <path d="M1000 20V330"/>
    <path d="M1060 20V330"/>
    <path d="M1120 20V330"/>
  </g>

  <rect x="72" y="62" width="124" height="30" rx="15" fill="#172033" stroke="#334155"/>
  <circle cx="91" cy="77" r="5" fill="#34D399"/>
  <text x="105" y="82" fill="#CBD5E1" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="600">BUILDING</text>

  <text x="72" y="151" fill="#F8FAFC" font-size="54" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-weight="760" letter-spacing="-1.5">Jorge Antonio</text>
  <text x="72" y="198" fill="url(#accent)" font-size="26" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-weight="650">Full-Stack Developer · Product Engineering · Applied AI</text>

  <text x="72" y="246" fill="#94A3B8" font-size="18" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    Turning complex workflows into focused, maintainable software.
  </text>

  <g transform="translate(72 286)">
    <rect width="118" height="34" rx="17" fill="#111827" stroke="#334155"/>
    <text x="59" y="22" text-anchor="middle" fill="#CBD5E1" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">WEB</text>
    <rect x="130" width="118" height="34" rx="17" fill="#111827" stroke="#334155"/>
    <text x="189" y="22" text-anchor="middle" fill="#CBD5E1" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">MOBILE</text>
    <rect x="260" width="118" height="34" rx="17" fill="#111827" stroke="#334155"/>
    <text x="319" y="22" text-anchor="middle" fill="#CBD5E1" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">DATA</text>
    <rect x="390" width="118" height="34" rx="17" fill="#111827" stroke="#334155"/>
    <text x="449" y="22" text-anchor="middle" fill="#CBD5E1" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">AI</text>
  </g>

  <g transform="translate(958 123)">
    <rect width="170" height="116" rx="16" fill="#0B1220" stroke="#334155"/>
    <circle cx="20" cy="20" r="5" fill="#F87171"/>
    <circle cx="38" cy="20" r="5" fill="#FBBF24"/>
    <circle cx="56" cy="20" r="5" fill="#34D399"/>
    <text x="18" y="58" fill="#64748B" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">$ focus</text>
    <text x="18" y="82" fill="#E2E8F0" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">ship useful</text>
    <text x="18" y="102" fill="#7DD3FC" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">software_</text>
  </g>
